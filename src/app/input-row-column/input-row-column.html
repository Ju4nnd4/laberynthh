<section 
  class="rows-columns-input-section" 
  #inputSection id="inputSection"
  [class.visible]="!showGrid"
  [class.hidden]="showGrid">
      
    <span class="title-and-definition-box">
      <h1>Hello, welcome to my labyrinthh</h1>
      <p>Enter the number of rows and columns to generate a labyrinth.</p>
    </span>

      <span class="input-box">Introduce the number of rows

        <input 
        type="number" 
        id="rowsInput" 
        [(ngModel)]="row"
        min="1" max="100" 
        placeholder="max 100 length" 
        class="real-input" >
      </span>

      <span class="input-box">Introduce the number of columns
        <input 
        type="number" 
        id="columnsInput" 
        [(ngModel)]="column"
        min="1" max="100" 
        placeholder="max 100 length" 
        class="real-input">
      </span>

      <button (click)="onGenerate()" class="generate-button">Generate Grid</button>

      
    </section>
    
    <section class="grid-section"
      [class.visible]="showGrid"
      [class.hidden]="!showGrid">

      <button (click)="showGrid = false" class="back-button">← Volver</button>
      <app-generate-grid [row]="row" [column]="column" [shouldGenerate]="showGrid">
      </app-generate-grid>

    </section>
