<button class="cell"
  [class.starterCell]="isStart"
  [class.goalCell]="isGoal"
  [class.walked]="isNeighbor"
  [class.obstacle]="isBlock"
  [class.tracePath]="isPath"
  id="{{id}}"
  (click)="toggleCell()"
  (mousedown)="onMouseDown()"
  (mouseenter)="onMouseEnter()"
  (mouseup)="onMouseUp()">
  
</button>
