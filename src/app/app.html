<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laberynthh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bytesized&display=swap" rel="stylesheet">
</head>
<body>
  
<section class="console-container">
  <div class="top-bar">
    <div class="indicator">
      <div class="key">Y</div>
      <span>BLOCK POINT</span>
    </div>
    <div class="indicator">
      <div class="key">X</div>
      <span>GOAL POINT</span>
    </div>
    <div class="indicator">
      <div class="key">B</div>
      <span>STARTER POINT</span>
    </div>
    <div class="indicator">
      <div class="key">A</div>
      <span>START</span>
    </div>
  </div>

  <div class="main-chassis">
    <app-left-controller></app-left-controller>
    <app-screen></app-screen>
    <app-right-controller></app-right-controller>
  </div>

</section>

</body>
</html>
